# Builds the Windows installer on GitHub's machines, the same way as
# `node apps/desktop/package-windows.ts` on a maintainer's Linux PC: the game-data extractor
# cross-compiled in a container (podman), electron-builder with wine for the .exe's icon and
# version. Run it by hand (Actions → Windows installer → Run workflow) for a test build, whose
# files are kept with the run; pushing a version tag (v0.1.3) also puts them on a draft release,
# published by hand after its notes are written.
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
      - name: Install wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wine64 wine32:i386 wine
      - run: npm ci --no-audit --no-fund
      - name: WC3V's packages (the simulation)
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: vendor/wc3v
      - run: npm run typecheck
      - run: npx vitest run
      - name: Game-data extractor (casc-extract.exe)
        run: scripts/casc/build-windows.sh
      - name: Installer
        run: node apps/desktop/package-windows.ts
        env:
          WINEDEBUG: "-all"
      - name: Checksums
        run: cd dist && sha256sum ReplayAltar-Setup-*.exe | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: ReplayAltar-Windows
          path: |
            dist/ReplayAltar-Setup-*.exe
            dist/ReplayAltar-Setup-*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "Replay Altar ${GITHUB_REF_NAME#v}" \
            --notes "Built by GitHub Actions from $GITHUB_SHA. Notes to be written." \
            dist/ReplayAltar-Setup-*.exe dist/ReplayAltar-Setup-*.exe.blockmap dist/latest.yml dist/SHA256SUMS.txt
